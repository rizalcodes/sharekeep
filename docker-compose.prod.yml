# Production overlay for the shared VPS.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from the base stack:
#   - backend/frontend join the existing reverse-proxy network (the ONLY thing shared
#     with the n8n project — Architecture.md §7)
#   - no host port publishing; all ingress goes through the proxy over HTTPS
#   - Postgres and Redis stay on the internal network only, unreachable from the host
#
# Set FILESHARE_PROXY_NETWORK to the name of the reverse proxy's existing Docker
# network. Confirm the actual name on the VPS before deploying (M8).

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  backend:
    ports: !reset []
    networks: [fileshare-internal, proxy]

  frontend:
    # FILESHARE_PUBLIC_API_BASE_URL must be set to the PUBLIC https origin of the API
    # before the image is built (it is a build arg in the base file, not runtime env).
    # Deploying a locally-built image here would ship a bundle pointing at
    # localhost:8000 — i.e. the visitor's own machine — and every request would fail
    # with nothing in the logs to explain it. Build on the target, or pass the public
    # value at build time.
    ports: !reset []
    networks: [fileshare-internal, proxy]

networks:
  proxy:
    external: true
    name: ${FILESHARE_PROXY_NETWORK:-proxy}
